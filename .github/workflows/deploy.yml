name: Deploy Survey Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: prosurvey2025
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: prosurvey2025/survey-frotend:latest

      - name: Deploy container
        run: |
          docker pull prosurvey2025/survey-frontend:latest
          docker stop offline_survey_web || true
          docker rm offline_survey_web || true
          docker run -d \
            --name offline_survey_web \
            --restart unless-stopped \
            -p 8001:3000 \
            prosurvey2025/survey-frontend:latest
